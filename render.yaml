# Render Blueprint — OpenSees V2 3D Building Editor
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: opensees-v2
    runtime: python
    region: singapore  # 한국에서 가까운 리전
    plan: free  # 512MB RAM, sleep on idle (cold start ~30s)
    buildCommand: |
      cd webapp/backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: |
      cd webapp/backend && python -m uvicorn app.main_simple:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/webapp/backend:/opt/render/project/src/mcp-server
      - key: MCP_SERVER_PATH
        value: /opt/render/project/src/mcp-server
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false  # Render 대시보드에서 수동 설정
      - key: SUPABASE_URL
        sync: false  # KDS DB 조회용 (없으면 fallback)
      - key: SUPABASE_KEY
        sync: false  # KDS DB 조회용 (없으면 fallback)
    healthCheckPath: /health
    autoDeploy: true
