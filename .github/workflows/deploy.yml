name: Build and Deploy to Azure Container Apps

on:
  workflow_dispatch:  # 수동 실행 (GitHub에서 버튼 클릭)
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'webapp/**'
      - 'data/**'
      - 'Dockerfile'
      - 'requirements.txt'

env:
  ACR_NAME: openseesdemo
  IMAGE_NAME: opensees-app
  RESOURCE_GROUP: opensees-demo-rg
  CONTAINER_APP_NAME: opensees-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest -f Dockerfile .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
